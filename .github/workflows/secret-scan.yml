# The pre-commit hook only covers commits made on a machine that installed it.
# This covers everything that reaches the remote.
name: secret-scan

on:
  push:
    branches: [master]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the point is to catch a secret in any commit, not just
          # in the tip.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan history
        run: ./gitleaks git --redact --verbose .

      - name: Scan the working tree
        run: ./gitleaks dir --redact --verbose .
