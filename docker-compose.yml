services:
  redis:
    container_name: cache
    image: redis
    command: redis-server --save 20 1 --loglevel warning --requirepass REDACTED_REDIS_PASSWORD
    ports:
      - 6379:6379
    volumes:
      - redis:/data
  db:
    image: postgres
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: kerberos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: REDACTED_POSTGRES_PASSWORD
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

volumes:
  redis:
    driver: local
