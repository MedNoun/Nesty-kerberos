# Backing services only. Credentials are interpolated from the root .env, which
# is gitignored: they used to be written inline here and in the README.
#
# The required variables use bare `${VAR:?}` rather than `${VAR:?some message}`.
# Compose still refuses to start when one is unset, but the prose form put
# literal words where a value belongs, which secret scanners read as a
# hardcoded password.
services:
  redis:
    container_name: cache
    # Images are pinned: unpinned `postgres` resolved to 18, which moved its
    # data directory and left this file unable to start at all.
    image: redis:8
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD:?}
    # Host ports come from .env so a machine already running Postgres or
    # something on 8080 can move them without editing this file.
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis:/data
  db:
    image: postgres:16
    restart: always
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kerberos}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres:/var/lib/postgresql/data
  adminer:
    image: adminer:4
    restart: always
    ports:
      - '${ADMINER_PORT:-8080}:8080'

volumes:
  redis:
    driver: local
  postgres:
    driver: local
